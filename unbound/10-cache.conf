# /etc/systemd/system/unbound.service.d/10-cache.conf
# unbound drops its cache on reload (HUP) and stop. Dump before, load after.
[Service]
ExecReload=
ExecReload=/usr/local/sbin/unbound-cache-dump
ExecReload=/bin/kill -HUP $MAINPID
ExecReload=/usr/local/sbin/unbound-cache-load
ExecStartPost=/usr/local/sbin/unbound-cache-load
ExecStop=/usr/local/sbin/unbound-cache-dump
